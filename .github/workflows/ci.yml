name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  c-build:
    name: Build C engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Build motor-c
        run: |
          cd motor-c
          make
          make test || true

  backend:
    name: Backend smoke checks
    runs-on: ubuntu-latest
    needs: c-build
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run backend smoke test (non-fatal)
        run: |
          python backend/test_wrapper.py || true

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install and build frontend
        run: |
          cd frontend
          npm ci
          npm run build

  validate-llm:
    name: Validate LLM artifacts (PRs)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Validate LLM artifacts
        run: |
          set -e
          if ls llm_artifacts/*.json 1> /dev/null 2>&1; then
            for f in llm_artifacts/*.json; do
              echo "Validating $f"
              python scripts/validate_llm_output.py --schema code_patch --file "$f"
            done
          else
            echo "No LLM artifacts found; skipping validation"
          fi
