id: M-C-01-ybus
title: Ensamblado de Y-bus
description: |
  Implementar la función `ybus_build` que construya la matriz de admitancias
  (Ybus) a partir de la lista de líneas y buses. La salida debe incluir la
  matriz Y en formato real/imag o como JSON de arrays.
context_files:
  - motor-c/src/network.h
  - motor-c/src/network.c
output_schema: |
  {
    "type": "object",
    "properties": {
      "task_id": {"type": "string"},
      "files": {"type": "array", "items": {"type":"object"}},
      "tests": {"type": "array", "items": {"type":"string"}}
    },
    "required": ["task_id","files"]
  }
prompt_template: |
  SYSTEM: You are an expert C developer. Respond ONLY with JSON that follows the output_schema.
  USER: Implement `ybus_build` in `motor-c/src/ybus.c`. Return files as patches.
model_preferences:
  temperature: 0.0
  max_tokens: 2000
acceptance_criteria:
  - ybus_build compila sin errores
  - Tests de referencia pasan
